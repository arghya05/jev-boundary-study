[project]
name = "jevstudy"
version = "0.1.0"
description = "When can decision models replace frontier LLMs? Controlled evidence on accuracy and cost."
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.70",
  "openai>=2.0",
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jevstudy = "jevstudy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevstudy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
