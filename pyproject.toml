[project]
name = "jev-judge"
version = "0.1.0"
description = "Cheap, calibrated LLM evaluation with the JEV-9B decision model, confidence-gated escalation, and a fair-comparison protocol."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Arghya Mukherjee"}]
keywords = ["llm-as-a-judge", "evaluation", "decision-model", "jev", "llm"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = [
  "anthropic>=0.70",
  "openai>=2.0",
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=15",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "huggingface_hub>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.urls]
Homepage = "https://github.com/arghya05/jev-boundary-study"
Paper = "https://github.com/arghya05/jev-boundary-study/blob/main/research-paper/JevBoundary_Paper.pdf"

[project.scripts]
jev-judge = "jevstudy.cli:main"
jevstudy = "jevstudy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevstudy", "src/jevjudge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
